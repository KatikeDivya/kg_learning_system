<!DOCTYPE html>
<html>
<head>
    <title>Career Recommender</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * { box-sizing: border-box; }

        .quiz-wrap {
            max-width: 640px;
            margin: 60px auto;
            padding: 0 16px;
        }

        h1 { color: #e2e8f0; text-align: center; margin-bottom: 4px; }
        .subtitle { color: #64748b; text-align: center; margin-bottom: 32px; font-size: 0.95rem; }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 99px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #38bdf8;
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeUp 0.3s ease; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .step-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .step h2 {
            font-size: 1.4rem;
            color: #f1f5f9;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option-btn {
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 14px;
            color: #cbd5e1;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: #38bdf8;
            background: rgba(56,189,248,0.08);
            color: #f1f5f9;
        }

        .option-btn.selected {
            border-color: #38bdf8;
            background: rgba(56,189,248,0.15);
            color: #ffffff;
        }

        .option-btn .emoji { font-size: 1.4rem; display: block; margin-bottom: 6px; }

        .next-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border-radius: 12px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .next-btn:hover { background: #0ea5e9; }
        .next-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #loading {
            display: none;
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 3px solid rgba(56,189,248,0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #result { display: none; }

        .career-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(56,189,248,0.25);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 20px;
        }

        .career-badge {
            display: inline-block;
            background: rgba(56,189,248,0.15);
            border: 1px solid rgba(56,189,248,0.3);
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 99px;
            margin-bottom: 12px;
        }

        .career-title {
            font-size: 2rem;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .why-fits {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .meta-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .meta-chip {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.82rem;
            color: #cbd5e1;
        }
        .meta-chip span { color: #94a3b8; display: block; font-size: 0.72rem; margin-bottom: 2px; }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .skill-tag {
            background: rgba(56,189,248,0.1);
            border: 1px solid rgba(56,189,248,0.2);
            color: #7dd3fc;
            font-size: 0.82rem;
            padding: 5px 12px;
            border-radius: 99px;
        }

        .roles-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .role-tag {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
            font-size: 0.82rem;
            padding: 5px 14px;
            border-radius: 8px;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.05rem;
            border-radius: 12px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 14px;
        }
        .start-btn:hover { background: #0ea5e9; }

        .also-title {
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 12px;
        }

        .also-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .also-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .also-card:hover {
            border-color: rgba(56,189,248,0.3);
            background: rgba(56,189,248,0.06);
        }
        .also-card .ac-title { color: #e2e8f0; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
        .also-card .ac-domain { color: #64748b; font-size: 0.78rem; }

        .retake-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            color: #64748b;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .retake-btn:hover { border-color: rgba(255,255,255,0.25); color: #94a3b8; }
    </style>
</head>
<body>
<div class="overlay"></div>

<div class="quiz-wrap">
    <h1>🧭 Career Finder</h1>
    <p class="subtitle">Answer 4 quick questions — get your ideal tech career path</p>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <!-- STEP 1 -->
    <div class="step active" id="step-1">
        <div class="step-label">Question 1 of 4</div>
        <h2>What excites you the most?</h2>
        <div class="options">
            <button class="option-btn" onclick="selectOption(this, 'interest', 'Building and shipping products that people use')">
                <span class="emoji">🏗️</span>Building products
            </button>
            <button class="option-btn" onclick="selectOption(this, 'interest', 'Analyzing data and finding hidden patterns')">
                <span class="emoji">📊</span>Analyzing data
            </button>
            <button class="option-btn" onclick="selectOption(this, 'interest', 'Protecting systems and solving security challenges')">
                <span class="emoji">🔐</span>Security & hacking
            </button>
            <button class="option-btn" onclick="selectOption(this, 'interest', 'Teaching machines to learn and making AI systems')">
                <span class="emoji">🤖</span>AI & machine learning
            </button>
        </div>
        <button class="next-btn" id="next-1" onclick="nextStep(2)" disabled>Continue →</button>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step-2">
        <div class="step-label">Question 2 of 4</div>
        <h2>How do you prefer to work?</h2>
        <div class="options">
            <button class="option-btn" onclick="selectOption(this, 'work_style', 'Creative and visual, I like designing experiences')">
                <span class="emoji">🎨</span>Creative & visual
            </button>
            <button class="option-btn" onclick="selectOption(this, 'work_style', 'Logical and systematic, I like solving hard problems')">
                <span class="emoji">🧩</span>Logical & systematic
            </button>
            <button class="option-btn" onclick="selectOption(this, 'work_style', 'Research-driven, I like exploring and experimenting')">
                <span class="emoji">🔬</span>Research & explore
            </button>
            <button class="option-btn" onclick="selectOption(this, 'work_style', 'Hands-on, I like building and deploying real systems')">
                <span class="emoji">⚙️</span>Hands-on & build
            </button>
        </div>
        <button class="next-btn" id="next-2" onclick="nextStep(3)" disabled>Continue →</button>
    </div>

    <!-- STEP 3 -->
    <div class="step" id="step-3">
        <div class="step-label">Question 3 of 4</div>
        <h2>Which area interests you most?</h2>
        <div class="options">
            <button class="option-btn" onclick="selectOption(this, 'field', 'Web and mobile applications')">
                <span class="emoji">🌐</span>Web & Mobile
            </button>
            <button class="option-btn" onclick="selectOption(this, 'field', 'Data science and business intelligence')">
                <span class="emoji">📈</span>Data & Analytics
            </button>
            <button class="option-btn" onclick="selectOption(this, 'field', 'Cloud infrastructure and DevOps')">
                <span class="emoji">☁️</span>Cloud & DevOps
            </button>
            <button class="option-btn" onclick="selectOption(this, 'field', 'Games and interactive media')">
                <span class="emoji">🎮</span>Games & Media
            </button>
        </div>
        <button class="next-btn" id="next-3" onclick="nextStep(4)" disabled>Continue →</button>
    </div>

    <!-- STEP 4 -->
    <div class="step" id="step-4">
        <div class="step-label">Question 4 of 4</div>
        <h2>What's your current experience level?</h2>
        <div class="options">
            <button class="option-btn" onclick="selectOption(this, 'level', 'Complete beginner, just starting out')">
                <span class="emoji">🌱</span>Complete beginner
            </button>
            <button class="option-btn" onclick="selectOption(this, 'level', 'Some experience with basic programming')">
                <span class="emoji">📚</span>Some experience
            </button>
            <button class="option-btn" onclick="selectOption(this, 'level', 'Intermediate, comfortable with coding')">
                <span class="emoji">💪</span>Intermediate
            </button>
            <button class="option-btn" onclick="selectOption(this, 'level', 'Advanced, looking to specialize')">
                <span class="emoji">🚀</span>Advanced
            </button>
        </div>
        <button class="next-btn" id="next-4" onclick="submitQuiz()" disabled>Find My Career 🎯</button>
    </div>

    <!-- LOADING -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Analyzing your answers...</p>
    </div>

    <!-- RESULT -->
    <div id="result"></div>
</div>

<script>
    const answers = {};

    function selectOption(btn, key, value) {
        btn.closest('.options').querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        answers[key] = value;
        const stepNum = btn.closest('.step').id.split('-')[1];
        document.getElementById('next-' + stepNum).disabled = false;
    }

    function nextStep(n) {
        document.querySelector('.step.active').classList.remove('active');
        document.getElementById('step-' + n).classList.add('active');
        document.getElementById('progressFill').style.width = ((n - 1) / 4 * 100) + '%';
    }

    async function submitQuiz() {
        document.getElementById('step-4').style.display = 'none';
        document.getElementById('loading').style.display = 'block';
        document.getElementById('progressFill').style.width = '100%';

        try {
            const res = await fetch('/api/career-recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(answers)
            });
            const data = await res.json();
            document.getElementById('loading').style.display = 'none';
            renderResult(data);
        } catch (err) {
            document.getElementById('loading').innerHTML = '<p style="color:#ef4444">Something went wrong. Please try again.</p>';
        }
    }

    function renderResult(data) {
        const el = document.getElementById('result');
        el.style.display = 'block';

        const skillsHTML = (data.top_skills || []).map(s => `<span class="skill-tag">${s}</span>`).join('');
        const rolesHTML = (data.job_roles || []).map(r => `<span class="role-tag">${r}</span>`).join('');
        const alsoHTML = (data.also_consider || []).map(a => `
            <div class="also-card" onclick="startLearning('${a.domain}')">
                <div class="ac-title">${a.career_title}</div>
                <div class="ac-domain">${a.domain}</div>
            </div>
        `).join('');

        el.innerHTML = `
            <div class="career-card">
                <div class="career-badge">Your Best Match</div>
                <div class="career-title">${data.career_title}</div>
                <p class="why-fits">${data.why_it_fits}</p>
                <div class="meta-row">
                    <div class="meta-chip"><span>Domain</span>${data.domain}</div>
                    <div class="meta-chip"><span>Salary</span>${data.salary_range}</div>
                    <div class="meta-chip"><span>Difficulty</span>${data.difficulty}</div>
                </div>
                <div class="section-title">Top Skills to Learn</div>
                <div class="skills-list">${skillsHTML}</div>
                <div class="section-title">Job Roles</div>
                <div class="roles-list">${rolesHTML}</div>
                <button class="start-btn" onclick="startLearning('${data.domain}')">
                    🚀 Start Learning ${data.career_title}
                </button>
            </div>
            <p class="also-title">Also worth considering</p>
            <div class="also-grid">${alsoHTML}</div>
            <button class="retake-btn" onclick="location.reload()">↩ Retake Quiz</button>
        `;
    }

    async function startLearning(domain) {
        const btns = document.querySelectorAll('.start-btn');
        btns.forEach(b => { b.disabled = true; b.textContent = '⏳ Generating path...'; });

        let level = "advanced";
        if (answers.level) {
            const lvl = answers.level.toLowerCase();
            if (lvl.includes("beginner")) {
                level = "beginner";
            } else if (lvl.includes("some experience") || lvl.includes("intermediate")) {
                level = "intermediate";
            } else if (lvl.includes("advanced")) {
                level = "advanced";
            }
        }

        try {
            const res = await fetch('/api/career-start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ domain, level })
            });
            const data = await res.json();
            localStorage.setItem('data', JSON.stringify(data));
            window.location.href = '/dashboard';
        } catch (err) {
            alert('Error generating learning path. Please try again.');
            btns.forEach(b => { b.disabled = false; b.textContent = '🚀 Start Learning'; });
        }
    }
</script>
</body>
</html>
